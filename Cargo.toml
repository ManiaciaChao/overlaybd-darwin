[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/agentenv"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libc = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
obd-core-adapter = { path = "crates/obd-core-adapter" }
obd-store = { path = "crates/obd-store" }
obd-protocol = { path = "crates/obd-protocol" }
obd-runtime = { path = "crates/obd-runtime" }
